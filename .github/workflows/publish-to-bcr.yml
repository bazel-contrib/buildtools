# Publishes each GitHub release to the Bazel Central Registry.
#
# Configure the BCR_REGISTRY_FORK repository variable and BCR_PUBLISH_TOKEN
# secret as described at https://github.com/bazel-contrib/publish-to-bcr#setup.
name: Publish to BCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: vars.BCR_REGISTRY_FORK != ''
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.1
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      registry_fork: ${{ vars.BCR_REGISTRY_FORK }}
      # This repository uses its own release workflow, not release_ruleset.
      attest: false
    permissions:
      contents: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
