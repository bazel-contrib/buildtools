# Builds and publishes all release artifacts whenever a v* tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to release
        required: true
        type: string

# Never let two runs race on the release for the same tag.
concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}

permissions: {}

jobs:
  release:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7  # v7.7.0
    with:
      draft: true
      prerelease: false
      release_files: dist/*
      tag_name: ${{ inputs.tag_name || github.ref_name }}

  publish-to-bcr:
    needs: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@ca23149e55cd4db07a6bcce69c02dea314c5a357  # v1.5.0
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      registry_fork: fmeum/bazel-central-registry
      # The fine-grained token used for the registry fork cannot open pull
      # requests against public repositories. The workflow prints a URL for
      # opening the pull request manually instead.
      open_pull_request: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  publish-release:
    needs: publish-to-bcr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Publish release
        run: gh release edit "${TAG}" --draft=false
